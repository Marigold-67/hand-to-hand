plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.marigold'
version = '0.1.0-beta.1'
base { archivesName = 'hand-in-hand-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
    maven { url = 'https://repo.redlance.org/public' }
    mavenCentral()
}
neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('run-client') }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
    }
    mods { handinhand { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.handinhand }
}
dependencies {
    // A local copy is useful in restricted/offline build environments. Never bundled in our JAR.
    if (project.hasProperty('localPal')) implementation files(project.property('localPal'))
    else implementation "com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}
if (project.hasProperty('smokeTest')) {
    // Keep every opt-in fixture output separate from production compilation and resources.
    layout.buildDirectory = layout.projectDirectory.dir('build-smoke')
    sourceSets.main.java.srcDir('src/smoke/java')
    sourceSets.main.resources.srcDir('src/smoke/resources')
    neoForge.runs.client {
        gameDirectory = file('run-smoke')
        systemProperty 'handinhand.smoke', project.hasProperty('manualDemo') || project.hasProperty('tetherTest') ? 'false' : 'true'
        systemProperty 'handinhand.demo', project.hasProperty('manualDemo') ? 'true' : 'false'
        systemProperty 'handinhand.tethertest', project.hasProperty('tetherTest') ? 'true' : 'false'
        systemProperty 'handinhand.tetherDelay', project.findProperty('tetherDelay') ?: '0'
        systemProperty 'handinhand.tetherScaled', project.hasProperty('tetherScaled') ? 'true' : 'false'
        programArguments.addAll '--width', '1100', '--height', '750'
    }
    tasks.named('processResources').configure { doLast { file("$destinationDir/META-INF/neoforge.mods.toml").append('\n[[mixins]]\nconfig="handinhand-smoke.mixins.json"\n') } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
test { useJUnitPlatform() }
tasks.named('jar') { from('LICENSE'); manifest.attributes('Implementation-Version': project.version) }
